<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Outfit Sprite Repair</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #111315;
      --panel: #191c1f;
      --panel-2: #22262a;
      --line: #353a40;
      --text: #f3f5f7;
      --muted: #9da5ae;
      --accent: #43d17b;
      --accent-dark: #122d1d;
      --danger: #ff7979;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    * { box-sizing: border-box; }
    body { margin: 0; min-width: 320px; background: var(--bg); color: var(--text); }
    button, input, select { font: inherit; }
    button:focus-visible, input:focus-visible, select:focus-visible, .drop:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    header { height: 58px; border-bottom: 1px solid var(--line); display: flex; align-items: center; padding: 0 24px; background: #151719; }
    .brand { display: flex; align-items: center; gap: 11px; font-size: 15px; font-weight: 700; }
    .brand-mark { width: 26px; height: 26px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 2px; }
    .brand-mark span { background: var(--accent); }
    main { display: grid; grid-template-columns: 300px minmax(0, 1fr); min-height: calc(100vh - 58px); }
    aside { border-right: 1px solid var(--line); padding: 20px; background: var(--panel); }
    .section-title { margin: 0 0 12px; color: var(--muted); font-size: 11px; text-transform: uppercase; font-weight: 700; }
    .fields { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    label { display: grid; gap: 6px; color: var(--muted); font-size: 12px; }
    input[type="number"], select { min-width: 0; width: 100%; height: 38px; padding: 0 10px; color: var(--text); background: var(--panel-2); border: 1px solid var(--line); border-radius: 5px; }
    .advanced { margin-top: 18px; padding-top: 18px; border-top: 1px solid var(--line); }
    .actions { margin-top: 20px; display: grid; gap: 9px; }
    .primary, .secondary { height: 42px; border-radius: 5px; border: 1px solid transparent; cursor: pointer; font-weight: 700; }
    .primary { background: var(--accent); color: #07150c; }
    .primary:hover { filter: brightness(1.08); }
    .primary:disabled { cursor: wait; opacity: .55; }
    .secondary { background: transparent; border-color: var(--line); color: var(--text); }
    .secondary:disabled { opacity: .4; cursor: not-allowed; }
    .status { min-height: 38px; margin-top: 14px; padding: 10px; border-left: 3px solid var(--line); color: var(--muted); font-size: 12px; line-height: 1.45; }
    .status.ok { border-color: var(--accent); color: #b9efca; background: var(--accent-dark); }
    .status.error { border-color: var(--danger); color: #ffc0c0; background: #32191b; }
    .workspace { padding: 20px; min-width: 0; }
    .input-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    .pane { min-width: 0; }
    .pane-head { height: 32px; display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
    .pane-head h2 { margin: 0; font-size: 13px; }
    .file-meta { color: var(--muted); font-size: 11px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .drop, .result-stage { position: relative; height: min(34vh, 330px); min-height: 210px; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; display: grid; place-items: center; background-color: #171a1d; background-image: linear-gradient(45deg, #202428 25%, transparent 25%), linear-gradient(-45deg, #202428 25%, transparent 25%), linear-gradient(45deg, transparent 75%, #202428 75%), linear-gradient(-45deg, transparent 75%, #202428 75%); background-size: 20px 20px; background-position: 0 0, 0 10px, 10px -10px, -10px 0px; }
    .drop { cursor: pointer; }
    .drop.drag { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
    .drop input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
    .drop img, .result-stage img { display: none; max-width: calc(100% - 24px); max-height: calc(100% - 24px); object-fit: contain; image-rendering: pixelated; }
    .drop.loaded img, .result-stage.loaded img { display: block; }
    .drop.loaded .placeholder, .result-stage.loaded .placeholder { display: none; }
    .placeholder { color: var(--muted); text-align: center; font-size: 12px; line-height: 1.7; padding: 24px; }
    .plus { display: block; margin: 0 auto 8px; width: 34px; height: 34px; border: 1px solid #535a62; border-radius: 50%; font-size: 23px; line-height: 30px; color: var(--text); }
    .result-wrap { margin-top: 20px; padding-top: 18px; border-top: 1px solid var(--line); }
    .result-head { display: flex; align-items: center; justify-content: space-between; min-height: 32px; gap: 12px; }
    .result-head h2 { margin: 0; font-size: 14px; }
    .result-meta { color: var(--muted); font-size: 11px; }
    .result-stage { height: min(43vh, 430px); }
    @media (max-width: 820px) {
      main { grid-template-columns: 1fr; }
      aside { border-right: 0; border-bottom: 1px solid var(--line); }
      .workspace { padding: 16px; }
    }
    @media (max-width: 560px) {
      header { padding: 0 16px; }
      .input-grid { grid-template-columns: 1fr; }
      .drop { height: 250px; }
    }
  </style>
</head>
<body>
  <header>
    <div class="brand"><span class="brand-mark" aria-hidden="true"><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span></span>Outfit Sprite Repair</div>
  </header>
  <main>
    <aside>
      <p class="section-title">Thiết lập sheet</p>
      <div class="fields">
        <label>Số cột<input id="cols" type="number" min="1" max="64" value="4"></label>
        <label>Số hàng<input id="rows" type="number" min="1" max="64" value="7"></label>
        <label>Làm nét màu
          <select id="colors">
            <option value="0">Không xử lý</option>
            <option value="16">Mạnh · 16 màu</option>
            <option value="32">Vừa · 32 màu</option>
            <option value="64" selected>Nhẹ · 64 màu</option>
            <option value="128">Rất nhẹ · 128 màu</option>
          </select>
        </label>
      </div>
      <div class="advanced">
        <p class="section-title">Tách nền</p>
        <label>Ngưỡng màu nền<input id="threshold" type="number" min="1" max="255" value="36"></label>
      </div>
      <div class="actions">
        <button id="repair" class="primary" type="button">Xử lý sprite</button>
        <button id="download" class="secondary" type="button" disabled>Tải PNG kết quả</button>
      </div>
      <div id="status" class="status" role="status">Chọn đủ hai ảnh để bắt đầu.</div>
    </aside>
    <section class="workspace">
      <div class="input-grid">
        <div class="pane">
          <div class="pane-head"><h2>Base chuẩn</h2><span id="baseMeta" class="file-meta"></span></div>
          <div id="baseDrop" class="drop" tabindex="0">
            <input id="baseFile" type="file" accept="image/png,image/webp,image/jpeg" aria-label="Chọn ảnh base">
            <div class="placeholder"><span class="plus">+</span>Kéo ảnh base vào đây<br>hoặc bấm để chọn</div>
            <img id="basePreview" alt="Ảnh base">
          </div>
        </div>
        <div class="pane">
          <div class="pane-head"><h2>Outfit cần sửa</h2><span id="outfitMeta" class="file-meta"></span></div>
          <div id="outfitDrop" class="drop" tabindex="0">
            <input id="outfitFile" type="file" accept="image/png,image/webp,image/jpeg" aria-label="Chọn ảnh outfit">
            <div class="placeholder"><span class="plus">+</span>Kéo ảnh outfit vào đây<br>hoặc bấm để chọn</div>
            <img id="outfitPreview" alt="Ảnh outfit">
          </div>
        </div>
      </div>
      <div class="result-wrap">
        <div class="result-head"><h2>Kết quả</h2><span id="resultMeta" class="result-meta"></span></div>
        <div id="resultStage" class="result-stage">
          <div class="placeholder">Ảnh đã làm sạch sẽ xuất hiện ở đây.</div>
          <img id="resultPreview" alt="Sprite outfit sau khi xử lý">
        </div>
      </div>
    </section>
  </main>
  <script>
    const state = { base: null, outfit: null, result: null };
    const $ = (id) => document.getElementById(id);

    function setStatus(message, type = "") {
      $("status").textContent = message;
      $("status").className = `status ${type}`.trim();
    }

    function readFile(file, kind) {
      if (!file || !file.type.startsWith("image/")) {
        setStatus("File đã chọn không phải là ảnh hợp lệ.", "error");
        return;
      }
      const reader = new FileReader();
      reader.onload = () => {
        const preview = $(kind + "Preview");
        preview.onload = () => {
          state[kind] = reader.result;
          $(kind + "Drop").classList.add("loaded");
          $(kind + "Meta").textContent = `${preview.naturalWidth} × ${preview.naturalHeight}`;
          setStatus(state.base && state.outfit ? "Đã sẵn sàng xử lý." : "Chọn thêm ảnh còn lại.");
        };
        preview.src = reader.result;
      };
      reader.readAsDataURL(file);
    }

    function bindDrop(kind) {
      const drop = $(kind + "Drop");
      const input = $(kind + "File");
      input.addEventListener("change", () => readFile(input.files[0], kind));
      drop.addEventListener("keydown", (event) => {
        if (event.key === "Enter" || event.key === " ") input.click();
      });
      ["dragenter", "dragover"].forEach((name) => drop.addEventListener(name, (event) => {
        event.preventDefault();
        drop.classList.add("drag");
      }));
      ["dragleave", "drop"].forEach((name) => drop.addEventListener(name, (event) => {
        event.preventDefault();
        drop.classList.remove("drag");
      }));
      drop.addEventListener("drop", (event) => readFile(event.dataTransfer.files[0], kind));
    }

    bindDrop("base");
    bindDrop("outfit");

    $("repair").addEventListener("click", async () => {
      if (!state.base || !state.outfit) {
        setStatus("Cần chọn cả ảnh base và ảnh outfit.", "error");
        return;
      }
      const button = $("repair");
      button.disabled = true;
      button.textContent = "Đang xử lý...";
      setStatus("Đang phục hồi da, tay, mắt và làm gọn palette...");
      try {
        const response = await fetch("/api/repair", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            base: state.base,
            outfit: state.outfit,
            cols: Number($("cols").value),
            rows: Number($("rows").value),
            colors: Number($("colors").value),
            skinExpand: 0,
            backgroundThreshold: Number($("threshold").value)
          })
        });
        const data = await response.json();
        if (!response.ok) throw new Error(data.error || "Không xử lý được ảnh");
        state.result = data.image;
        $("resultPreview").src = data.image;
        $("resultStage").classList.add("loaded");
        $("resultMeta").textContent = `${data.width} × ${data.height} · ${data.frameCount} frame`;
        $("download").disabled = false;
        setStatus(`Hoàn tất. Phục hồi ${data.restoredPixels.toLocaleString("vi-VN")} pixel đầu/mặt và làm rõ ${data.outlinedPixels.toLocaleString("vi-VN")} pixel outline.`, "ok");
      } catch (error) {
        setStatus(error.message, "error");
      } finally {
        button.disabled = false;
        button.textContent = "Xử lý sprite";
      }
    });

    $("download").addEventListener("click", () => {
      if (!state.result) return;
      const link = document.createElement("a");
      link.href = state.result;
      link.download = "outfit-repaired.png";
      link.click();
    });
  </script>
</body>
</html>
